<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0A0C10">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="DSH 用量">
<title>DSH Token 用量</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<style>
/* ============================================================
   DSH Token 用量 · 品牌样式（方案 A · Monolith）
   整段替换 web/index.html 中 <style> 里的全部内容即可
   配合 5 处 JS 取色改动（见 README-design.md）
   ============================================================ */

/* ---------- 1. 主题令牌 ---------- */

:root{
  color-scheme:dark;
  --bg:#0A0C10; --surface:#12151B; --surface-2:#191D25;
  --line:#242A35; --line-strong:#333A48;
  --ink:#EAF0F7; --ink-2:#A6B0BE; --ink-3:#7D8797;
  --accent:#33E6A6; --accent-soft:rgba(51,230,166,.13); --accent-ink:#5BF0B9;
  --pos:#33E6A6; --warn:#F0B44A; --warn-soft:rgba(240,180,74,.14); --danger:#FF7A6B; --info:#7A9DFF;
  --c1:#33E6A6; --c2:#7A9DFF; --c3:#B98CFF; --c4:#F0B44A; --c5:#38C9E0; --c6:#FF8F6B;
  --c-in:#7A9DFF; --c-out:#33E6A6; --c-cache:#B98CFF;
  --heat0:#171B22; --heat1:#12402E; --heat2:#1B6B4C; --heat3:#26A677; --heat4:#3FE6A8;
  --shadow-card:inset 0 1px 0 rgba(255,255,255,.028), 0 1px 2px rgba(0,0,0,.4);
  --theme-color:#0A0C10;
}


/* ---------- 2. 结构与组件 ---------- */
:root{
  --font-sans:-apple-system,BlinkMacSystemFont,"SF Pro SC","PingFang SC","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --font-mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;
  --r-card:14px; --r-inner:10px; --r-pill:999px;
  --ease:cubic-bezier(.32,.72,0,1);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
html,body{margin:0;padding:0}
body{
  font-family:var(--font-sans); background:var(--bg); color:var(--ink);
  font-size:13px; line-height:1.55; letter-spacing:.005em;
  padding-bottom:calc(18px + env(safe-area-inset-bottom));
  -webkit-font-smoothing:antialiased;
}
.wrap{max-width:560px;margin:0 auto;padding:0 14px}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}

/* ---------- 顶栏：从渐变色块改成「无框 masthead」 ---------- */
header{
  position:sticky;top:0;z-index:20;background:var(--bg);
  border-bottom:1px solid var(--line);
  padding:calc(10px + env(safe-area-inset-top)) 0 10px;
}
.hd-top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.brand{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:650;letter-spacing:.01em;color:var(--ink)}
.brand .dot{width:7px;height:7px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.brand .dot.warn{background:var(--warn);box-shadow:0 0 0 3px var(--warn-soft)}
.stale-tag{display:inline-block;margin-left:4px;padding:1px 6px;border-radius:5px;
  background:var(--warn-soft);color:var(--warn);font-size:10px;font-weight:600;letter-spacing:.02em}
.hd-sub{display:flex;align-items:center;gap:5px;margin-top:4px;font-size:11px;color:var(--ink-3);letter-spacing:.01em}
.hd-sub svg{opacity:.85;flex:0 0 auto}
.hd-actions{display:flex;gap:8px}
.icon-btn{
  width:38px;height:38px;border-radius:var(--r-inner);cursor:pointer;
  background:var(--surface);border:1px solid var(--line);color:var(--ink-2);
  display:grid;place-items:center;transition:background .16s var(--ease),color .16s var(--ease);
}
.icon-btn:active{background:var(--accent-soft);color:var(--accent-ink);border-color:transparent}
.icon-btn.spin svg{animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}

/* ---------- 分段切换：内嵌 track，选中用表面抬升 ---------- */
.tabs{display:flex;gap:2px;background:var(--surface-2);border:1px solid var(--line);padding:3px;border-radius:12px;margin-top:10px}
.tabs button{
  flex:1;border:0;background:transparent;color:var(--ink-3);font-family:inherit;
  font-size:12.5px;font-weight:600;letter-spacing:.01em;padding:7px 0;min-height:32px;
  border-radius:9px;cursor:pointer;transition:color .16s var(--ease),background .16s var(--ease),box-shadow .16s var(--ease);
}
.tabs button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(8,12,20,.10),0 0 0 1px var(--line)}

/* ---------- 月度翻页 ---------- */
.month-nav{display:flex;align-items:center;gap:8px;margin-top:8px}
.month-nav[hidden]{display:none}
.mn-btn{
  width:38px;height:34px;flex:0 0 38px;border-radius:var(--r-inner);cursor:pointer;
  background:var(--surface);border:1px solid var(--line);color:var(--ink-2);
  display:grid;place-items:center;transition:background .16s var(--ease),color .16s var(--ease),opacity .16s var(--ease);
}
.mn-btn:active{background:var(--accent-soft);color:var(--accent-ink);border-color:transparent}
.mn-btn:disabled{opacity:.32;cursor:not-allowed}
.mn-btn:disabled:active{background:var(--surface);color:var(--ink-2);border-color:var(--line)}
.mn-label{
  flex:1;text-align:center;font-size:13px;font-weight:650;color:var(--ink);
  letter-spacing:.02em;font-variant-numeric:tabular-nums;
}
.mn-label small{display:block;font-size:10px;font-weight:500;color:var(--ink-3);letter-spacing:.02em;margin-top:1px}

/* ---------- 卡片：描边为主，阴影极轻 ---------- */
.card{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r-card);
  box-shadow:var(--shadow-card);padding:15px 15px 16px;margin-top:10px;
}
main .card:first-child{margin-top:12px}
.card-hd{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:12px}
.card-title{display:flex;align-items:center;gap:7px;font-size:14px;font-weight:650;color:var(--ink);letter-spacing:0}
.card-title::before{display:none}
.card-sub{font-size:11px;color:var(--ink-3);margin-top:3px;padding-left:0;letter-spacing:.01em}

/* ---------- 主指标 ---------- */
.hero{display:flex;gap:12px;align-items:flex-start}
.hero-main{flex:1;min-width:0}
.hero-label{font-size:11px;color:var(--ink-3);display:flex;align-items:center;gap:6px;letter-spacing:.05em}
.hero-value{
  font-size:44px;font-weight:750;line-height:1;letter-spacing:-.035em;margin:9px 0 7px;
  color:var(--ink);background:none;-webkit-text-fill-color:var(--ink);background-clip:border-box;
}
.hero-value .u{font-size:17px;font-weight:600;letter-spacing:0;color:var(--ink-3);margin-left:3px}
.hero-note{font-size:11.5px;color:var(--ink-3);letter-spacing:.01em;font-variant-numeric:tabular-nums}
.note-tag{display:inline-block;margin-left:3px;padding:1px 5px;border-radius:4px;
  background:var(--surface-2);color:var(--ink-3);font-size:9.5px;font-weight:600;letter-spacing:.02em;vertical-align:1px}
.pulse{width:96px;flex:0 0 96px;border-radius:var(--r-inner);background:var(--surface-2);padding:9px 8px 8px;text-align:center}
.pulse svg{display:block;margin:0 auto}
.pulse .t{font-size:10.5px;font-weight:600;color:var(--ink-2);margin-top:5px;letter-spacing:.02em}
.pulse .s{font-size:9.5px;color:var(--ink-3);margin-top:1px}
.chip{
  display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:650;
  background:var(--accent-soft);color:var(--accent-ink);border-radius:var(--r-pill);
  padding:5px 10px;margin-top:10px;letter-spacing:.01em;
}

/* ---------- 三宫格 ---------- */
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:14px}
.mini{background:var(--surface-2);border-radius:var(--r-inner);padding:9px 10px;min-width:0}
.mini .k{font-size:10.5px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:.02em}
.mini .v{font-size:17px;font-weight:700;margin-top:3px;letter-spacing:-.02em;color:var(--ink)}
.mini .v small{font-size:11px;font-weight:600}
.mini.green{background:var(--surface-2)}
.mini.green .v{color:var(--pos)}

/* ---------- 构成 ---------- */
.split{display:grid;grid-template-columns:repeat(3,1fr);gap:0}
.split .cell{padding:0 8px 0 10px;border-left:1px solid var(--line);min-width:0}
.split .cell:first-child{border-left:0;padding-left:0}
.split .k{font-size:11px;color:var(--ink-3);font-weight:600;display:flex;align-items:center;gap:5px;letter-spacing:.02em}
.split .k::before{content:"";width:6px;height:6px;border-radius:2px;flex:0 0 6px;background:var(--c-in)}
.split .cell:nth-child(2) .k::before{background:var(--c-out)}
.split .cell:nth-child(3) .k::before{background:var(--c-cache)}
.split .v{font-size:17px;font-weight:700;margin:4px 0 1px;letter-spacing:-.02em;color:var(--ink)}
.split .v small{font-size:10.5px;font-weight:600;color:var(--ink-3);letter-spacing:0}
.split .s{font-size:10px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ---------- 折线图 ---------- */
.chart-box{position:relative;margin:0 -2px}
.chart-box svg{display:block;width:100%;height:auto;overflow:visible}
.chart-x{display:flex;justify-content:space-between;font-size:9.5px;color:var(--ink-3);margin-top:4px;padding:0 2px;letter-spacing:.04em;font-variant-numeric:tabular-nums}

/* ---------- 环形 ---------- */
.donut-row{display:flex;align-items:center;gap:16px}
.donut{position:relative;flex:0 0 112px;width:112px;height:112px}
.donut svg{transform:rotate(-90deg)}
.donut .c{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.donut .c b{display:block;font-size:24px;font-weight:750;letter-spacing:-.03em;color:var(--ink);line-height:1.1}
.donut .c span{font-size:9.5px;color:var(--ink-3);letter-spacing:.08em}
.legend{flex:1;min-width:0;display:flex;flex-direction:column;gap:12px}
.lg{display:flex;align-items:center;gap:9px}
.lg .bar{width:8px;height:8px;border-radius:3px;flex:0 0 8px}
.lg .mid{flex:1;min-width:0}
.lg .n{font-size:12.5px;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink)}
.lg .s{font-size:10px;color:var(--ink-3);margin-top:1px}
.lg .p{font-size:12.5px;font-weight:700;text-align:right;flex:0 0 auto;font-variant-numeric:tabular-nums;letter-spacing:-.01em}

/* ---------- 排行：去掉彩色块，改单色强度阶梯 ---------- */
.rank{display:flex;flex-direction:column;gap:0}
.rk{display:grid;grid-template-columns:22px 1fr auto;align-items:center;gap:10px;
  padding:9px 0;border-radius:0;background:transparent;border-bottom:1px solid var(--line)}
.rk:last-child{border-bottom:0;padding-bottom:2px}
.rk .idx{width:auto;height:auto;border-radius:0;background:none;justify-self:start;padding-top:2px;
  font-family:var(--font-mono);font-size:10.5px;font-weight:600;color:var(--ink-3);letter-spacing:.02em}
.rk .nm{font-size:12.5px;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink)}
.rk .meta{font-size:10px;color:var(--ink-3);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  font-variant-numeric:tabular-nums;letter-spacing:.01em}
.rk .pct{font-size:13px;font-weight:700;text-align:right;font-variant-numeric:tabular-nums;letter-spacing:-.02em;color:var(--ink)}
.rk .track{grid-column:2 / -1;height:4px;border-radius:var(--r-pill);background:var(--surface-2);overflow:hidden;margin-top:6px}
.rk .fill{height:100%;border-radius:var(--r-pill);background:var(--accent);transition:width .3s var(--ease)}
.rank .rk:nth-child(1) .fill{opacity:1}
.rank .rk:nth-child(2) .fill{opacity:.9}
.rank .rk:nth-child(3) .fill{opacity:.8}
.rank .rk:nth-child(4) .fill{opacity:.72}
.rank .rk:nth-child(5) .fill{opacity:.64}
.rank .rk:nth-child(6) .fill{opacity:.56}
.rank .rk:nth-child(7) .fill{opacity:.48}
.rank .rk:nth-child(8) .fill{opacity:.42}
.rank .rk:nth-child(9) .fill{opacity:.36}
.rank .rk:nth-child(10) .fill{opacity:.3}
.rank .rk:nth-child(11) .fill{opacity:.26}
.rank .rk:nth-child(12) .fill{opacity:.22}

/* ---------- 热力图 ---------- */
.heat{display:flex;gap:8px;margin-top:6px;align-items:stretch}
.heat .wd{display:grid;grid-template-rows:repeat(7,1fr);gap:3px;flex:0 0 auto;align-items:center;
  font-family:var(--font-mono);font-size:8.5px;color:var(--ink-3);line-height:1;letter-spacing:.02em}
.heat .cols{flex:1;min-width:0;display:flex;gap:3px}
.heat .col{flex:1 1 0;min-width:0;display:flex;flex-direction:column;gap:3px}
.heat .cell{aspect-ratio:1;border-radius:3px;background:var(--heat0);min-width:0}
.heat-scale{display:flex;align-items:center;gap:2px;font-size:9px;color:var(--ink-3);flex:0 0 auto;letter-spacing:.04em;padding-bottom:1px}
.heat-scale i{width:8px;height:8px;border-radius:2px;display:block}

/* ---------- 会话列表 ---------- */
.sess{display:flex;flex-direction:column;gap:0}
.srow{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);font-size:12.5px;min-height:44px}
.srow:last-child{border-bottom:0;padding-bottom:2px}
.srow .tag{font-size:9.5px;padding:2px 7px;border-radius:6px;background:var(--accent-soft);color:var(--accent-ink);
  font-weight:700;flex:0 0 auto;letter-spacing:.02em}
.srow .tag.sub{background:var(--warn-soft);color:var(--warn)}
.srow .nm{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink-2);
  font-family:var(--font-mono);font-size:11.5px;letter-spacing:-.01em}
.srow .v{font-weight:700;flex:0 0 auto;color:var(--ink);font-variant-numeric:tabular-nums;letter-spacing:-.02em}

.empty{padding:24px 0;text-align:center;color:var(--ink-3);font-size:12px}

/* ---------- 可折叠说明：grid-rows 折叠，比 max-height 稳 ---------- */
.coll-hd{cursor:pointer;align-items:center;margin-bottom:0;min-height:44px;gap:10px}
.coll-hd .chev{flex:0 0 auto;transition:transform .25s var(--ease);color:var(--ink-3)}
.collapsible.open .coll-hd{margin-bottom:10px}
.collapsible .body{display:grid;grid-template-rows:0fr;transition:grid-template-rows .28s var(--ease);overflow:hidden;max-height:none}
.collapsible.open .body{grid-template-rows:1fr;max-height:none}
.collapsible .body>*{min-height:0;overflow:hidden}
@supports not (grid-template-rows:0fr){
  .collapsible .body{display:block;max-height:0;transition:max-height .3s var(--ease)}
  .collapsible.open .body{max-height:900px}
}
.collapsible.open .coll-hd .chev{transform:rotate(180deg)}
.about{font-size:12px;color:var(--ink-2);line-height:1.8;letter-spacing:.005em}
.about b{color:var(--ink)}
.about ul{margin:0;padding-left:16px}
.about li{margin-bottom:5px}
.about code{font-family:var(--font-mono);font-size:10.5px;background:var(--surface-2);border-radius:4px;
  padding:1.5px 5px;color:var(--ink);letter-spacing:-.01em}
.about .kv{display:flex;gap:10px;padding:7px 0;border-top:1px solid var(--line)}
.about .kv:first-of-type{border-top:0;padding-top:0}
.about .kv span:first-child{flex:0 0 64px;font-size:11px;color:var(--ink-3);letter-spacing:.02em}

.footer{text-align:center;font-size:10.5px;color:var(--ink-3);padding:20px 0 6px;line-height:1.75;letter-spacing:.02em}
.err{background:var(--warn-soft);color:var(--danger);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:12px;margin-top:12px}
.skeleton{height:88px;border-radius:var(--r-card);background:linear-gradient(90deg,var(--surface-2) 25%,var(--surface) 37%,var(--surface-2) 63%);
  background-size:400% 100%;animation:sk 1.3s ease infinite;border:1px solid var(--line)}
@keyframes sk{0%{background-position:100% 50%}100%{background-position:0 50%}}

/* ---------- 无障碍与动效 ---------- */
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
button:focus-visible{outline-offset:3px}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms!important;transition-duration:.001ms!important}
}
@media (min-width:560px){
  .wrap{padding:0 16px}
  .hero-value{font-size:48px}
  .card{padding:17px 17px 18px}
}
</style>
</head>
<body>

<header>
  <div class="wrap">
    <div class="hd-top">
      <div class="brand"><span class="dot"></span>DSH Token 用量</div>
      <div class="hd-actions">
        <button class="icon-btn" id="btn-refresh" title="刷新数据" aria-label="刷新">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
            <path d="M21 12a9 9 0 1 1-3.2-6.9"/><path d="M21 3v6h-6"/>
          </svg>
        </button>
      </div>
    </div>
    <div class="hd-sub">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round">
        <path d="M2 12h4l3-8 4 16 3-8h6"/>
      </svg>
      <span id="hd-status">正在读取本地会话…</span>
    </div>
    <div class="tabs" id="tabs">
      <button data-range="today">今日</button>
      <button data-range="7d">7 天</button>
      <button data-range="30d" class="on">30 天</button>
      <button data-range="month">月度</button>
      <button data-range="all">全部</button>
    </div>
    <div class="month-nav" id="month-nav" hidden>
      <button class="mn-btn" id="mn-prev" aria-label="上一月">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
      </button>
      <div class="mn-label" id="mn-label">2026 年 11 月</div>
      <button class="mn-btn" id="mn-next" aria-label="下一月">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>
      </button>
    </div>
  </div>
</header>

<main class="wrap" id="main">
  <div class="skeleton" style="margin-top:12px"></div>
  <div class="skeleton" style="margin-top:12px;height:120px"></div>
</main>

<div class="wrap">

<script>
const $ = (s, r = document) => r.querySelector(s);
const el = (tag, cls, html) => { const n = document.createElement(tag); if (cls) n.className = cls; if (html != null) n.innerHTML = html; return n; };

let RANGE = '30d';
let MONTH = null;        // 当前选中的月份 'YYYY-MM'（仅 RANGE==='month' 时有效）
let activeStats = null;  // 当前 RANGE 真正用于渲染的那份聚合（月度时指向某个月）
let STATS = null;
let HEAT = null;
let BUNDLE = null;
// 该时间窗是否掺入了「历史归档」数据（会话文件已被清理，只剩按天账本）。
// 判定：全部/月度里存在 provider==='archived' 的模型条目。
let LEGACY_NOTES = new Set();
// 静态部署时数据直接内联在页面里（window.__DSH_USAGE__），本地服务模式则走 /api/data
const PRELOADED = (typeof window !== 'undefined' && window.__DSH_USAGE__) || null;
const IS_STATIC = !!PRELOADED;

/* ---------------- 数字格式化 ---------------- */
function fmtTokens(n) {
  n = n || 0;
  if (n >= 1e9) return { v: (n / 1e9).toFixed(3).replace(/\.?0+$/, ''), u: 'B' };
  if (n >= 1e6) return { v: (n / 1e6).toFixed(1).replace(/\.0$/, ''), u: 'M' };
  if (n >= 1e3) return { v: (n / 1e3).toFixed(1).replace(/\.0$/, ''), u: 'K' };
  return { v: String(n), u: '' };
}
const shortT = (n) => { const f = fmtTokens(n); return f.v + f.u; };
const pct = (x, d = 1) => (x * 100).toFixed(d).replace(/\.0$/, '') + '%';
const money = (n) => n.toLocaleString('zh-CN');

/* ---------------- 取数 ---------------- */
async function api(path) {
  const r = await fetch(path, { cache: 'no-store' });
  if (!r.ok) throw new Error('HTTP ' + r.status);
  return r.json();
}

/** 解析当前该渲染哪份聚合：月度看 MONTH，其它直接取 ranges[RANGE] */
function resolveStats() {
  const m = BUNDLE.ranges.month;
  if (RANGE !== 'month') { activeStats = BUNDLE.ranges[RANGE]; return activeStats; }
  if (!m) { activeStats = BUNDLE.ranges['30d']; return activeStats; }
  if (!MONTH) MONTH = m.currentMonth;                                  // 默认落在当前月
  if (!m.months[MONTH]) MONTH = m.availableMonths[m.availableMonths.length - 1] || m.currentMonth;
  activeStats = m.months[MONTH] || m;
  return activeStats;
}

/** 该份聚合里有没有归档数据的痕迹 */
function hasLegacy(stats) {
  return (stats?.byModel || []).some((m) => m.provider === 'archived' || m.providers?.includes?.('archived'));
}

/** 'YYYY-MM' → '2026 年 11 月' */
function ymLabel(ym) {
  if (!ym) return '';
  const [y, m] = ym.split('-');
  return `${y} 年 ${Number(m)} 月`;
}

async function load(refresh) {
  const btn = $('#btn-refresh');

  try {

    STATS = resolveStats();
    LEGACY_NOTES = new Set(hasLegacy(STATS) ? [RANGE] : []);
    HEAT = BUNDLE.heatmap;
    render();
    const d = new Date(BUNDLE.generatedAt);
    const stamp = d.toLocaleString('zh-CN', { month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit' });
    // 静态快照超过 90 分钟没更新，说明本机同步没跑（关机/断网/任务失败），明确标出来，
    // 免得把旧数字当实时数据去分享。
    const ageMin = Math.round((Date.now() - BUNDLE.generatedAt) / 60000);
    const stale = IS_STATIC && ageMin > 90;
    $('#hd-status').innerHTML = `${IS_STATIC ? '数据快照' : '本地实时'} · ${STATS.totals.sessions} 个会话 · ${stamp}`
      + (stale
        ? ` <span class="stale-tag">${ageMin >= 1440 ? `${Math.floor(ageMin / 1440)} 天前` : `${Math.floor(ageMin / 60)} 小时前`}未更新</span>`
        : '');
    document.querySelector('.brand .dot').classList.toggle('warn', stale);
  } catch (e) {
    $('#main').innerHTML = '';
    $('#main').appendChild(el('div', 'err', '读取失败：' + e.message + '<br>确认服务在运行，且 DSH_HOME 指向 dsh-data。'));
    $('#hd-status').textContent = '数据连接异常';
  } finally {
    btn.classList.remove('spin');
  }
}

/* ---------------- 渲染 ---------------- */
function render() {
  const s = STATS, t = s.totals;
  const main = $('#main');
  main.innerHTML = '';

  const rangeLabel = RANGE === 'month'
    ? ymLabel(MONTH)
    : { today: '今日', '7d': '最近 7 天', '30d': '最近 30 天', all: '全部时间' }[RANGE];
  const hero = fmtTokens(t.total);

  /* --- 主卡片 --- */
  const c1 = el('section', 'card');
  const pulseMax = Math.max(...s.byDay.map(d => d.total), 1);
  const spark = s.byDay.slice(-14).map((d, i, a) => {
    const w = 100, h = 30;
    const x = a.length > 1 ? (i / (a.length - 1)) * w : w / 2;
    const y = h - (d.total / pulseMax) * (h - 4) - 2;
    return `${x.toFixed(1)},${y.toFixed(1)}`;
  }).join(' ');
  c1.innerHTML = `
    <div class="hero">
      <div class="hero-main">
        <div class="hero-label">${rangeLabel} 累计消耗</div>
        <div class="hero-value num">${hero.v}<span class="u">${hero.u}</span></div>
        <div class="hero-note">Token 总量 · ${money(t.total)}${
          (RANGE === 'all' || RANGE === 'month') && LEGACY_NOTES.has(RANGE) ? ' <span class="note-tag">含历史归档</span>' : ''
        }</div>
        <div class="chip">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
          ${t.sessions} 个会话
        </div>
      </div>
      <div class="pulse">
        <svg width="100%" height="34" viewBox="0 0 100 34" preserveAspectRatio="none">
          <polyline points="${spark}" fill="none" style="stroke:var(--accent)" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/>
        </svg>
        <div class="t">脉冲</div>
        <div class="s">近 ${s.byDay.length} 天</div>
      </div>
    </div>
    <div class="grid3">
      <div class="mini"><div class="k">输入</div><div class="v num">${shortT(t.input)}</div></div>
      <div class="mini"><div class="k">输出</div><div class="v num">${shortT(t.output)}</div></div>
      <div class="mini green"><div class="k">缓存命中</div><div class="v num">${pct(t.cacheHitRate)}</div></div>
    </div>`;
  main.appendChild(c1);

  /* --- 构成 --- */
  const c2 = el('section', 'card');
  c2.innerHTML = `
    <div class="card-hd"><div>
      <div class="card-title">TOKEN 构成</div>
      <div class="card-sub">所选范围的汇总计数</div>
    </div></div>
    <div class="split">
      <div class="cell"><div class="k">输入</div><div class="v num">${shortT(t.input)}</div><div class="s">未缓存请求</div></div>
      <div class="cell"><div class="k">输出</div><div class="v num">${shortT(t.output)}</div><div class="s">响应</div></div>
      <div class="cell"><div class="k">缓存读取</div><div class="v num">${pct(t.cacheHitRate)}</div><div class="s">${shortT(t.cacheRead)}</div></div>
    </div>`;
  main.appendChild(c2);

  /* --- 每日趋势 --- */
  const c3 = el('section', 'card');
  const days = s.byDay;
  if (!days.length) {
    c3.innerHTML = `<div class="card-title">每日 TOKEN 趋势</div><div class="empty">该时间范围内没有消耗记录</div>`;
  } else {
    c3.innerHTML = `
      <div class="card-hd"><div>
        <div class="card-title">每日 TOKEN 趋势</div>
        <div class="card-sub">${rangeLabel} · 按自然日聚合</div>
      </div></div>
      <div class="chart-box">${lineChart(days)}</div>
      <div class="chart-x"><span>${days[0].day.slice(5)}</span><span>${days[Math.floor(days.length / 2)].day.slice(5)}</span><span>${days[days.length - 1].day.slice(5)}</span></div>`;
  }
  main.appendChild(c3);

  /* --- 热力图 --- */
  const c4 = el('section', 'card');
  c4.innerHTML = `
    <div class="card-hd">
      <div>
        <div class="card-title">活动热力</div>
        <div class="card-sub">最近 ${HEAT ? HEAT.weeks : 26} 周 · 每日 Token 强度</div>
      </div>
      <div class="heat-scale">低 ${[0.05, 0.2, 0.45, 0.7, 1].map(a => `<i style="background:${heatColor(a)}"></i>`).join('')} 高</div>
    </div>
    ${heatBlock(HEAT)}`;
  main.appendChild(c4);

  /* --- 模型排行（Top 5） --- */
  const TOP_MODELS = 5;
  const c5 = el('section', 'card');
  const totalT = Math.max(t.total, 1);
  const rows = s.byModel.slice(0, TOP_MODELS).map((m, i) => {
    const share = m.total / totalT;
    return `<div class="rk">
      <div class="idx">${String(i + 1).padStart(2, '0')}</div>
      <div style="min-width:0">
        <div class="nm">${esc(m.model)}</div>
        <div class="meta">${shortT(m.total)} Token · 缓存 ${pct(m.cacheHitRate)}</div>
      </div>
      <div class="pct num">${share < 0.001 && share > 0 ? '<0.1%' : pct(share)}</div>
      <div class="track"><div class="fill" style="width:${Math.max(share * 100, 0.6)}%"></div></div>
    </div>`;
  }).join('');
  c5.innerHTML = `
    <div class="card-hd"><div>
      <div class="card-title">模型占比</div>
      <div class="card-sub">Top ${TOP_MODELS} · 同名模型已跨渠道合并</div>
    </div></div>
    <div class="rank">${rows || '<div class="empty">暂无数据</div>'}</div>`;
  main.appendChild(c5);

  $('#footer').innerHTML = `${IS_STATIC ? '静态快照' : '数据来自本机 DSH 会话存档'}（${esc(s.timeZone)}）<br>更新于 ${new Date(BUNDLE.generatedAt).toLocaleString('zh-CN')}`;
}

/* ---------------- 图表 ---------------- */
function lineChart(days) {
  const W = 320, H = 130, PL = 30, PR = 6, PT = 8, PB = 18;
  const iw = W - PL - PR, ih = H - PT - PB;
  const max = Math.max(...days.map(d => d.total), 1);
  const nice = niceMax(max);
  const x = (i) => PL + (days.length > 1 ? (i / (days.length - 1)) * iw : iw / 2);
  const y = (v) => PT + ih - (v / nice) * ih;

  const pts = days.map((d, i) => [x(i), y(d.total)]);
  // 平滑曲线（Catmull-Rom → 三次贝塞尔）
  let dPath = `M${pts[0][0].toFixed(1)},${pts[0][1].toFixed(1)}`;
  for (let i = 0; i < pts.length - 1; i++) {
    const p0 = pts[i - 1] || pts[i], p1 = pts[i], p2 = pts[i + 1], p3 = pts[i + 2] || p2;
    const c1x = p1[0] + (p2[0] - p0[0]) / 6, c1y = p1[1] + (p2[1] - p0[1]) / 6;
    const c2x = p2[0] - (p3[0] - p1[0]) / 6, c2y = p2[1] - (p3[1] - p1[1]) / 6;
    dPath += ` C${c1x.toFixed(1)},${c1y.toFixed(1)} ${c2x.toFixed(1)},${c2y.toFixed(1)} ${p2[0].toFixed(1)},${p2[1].toFixed(1)}`;
  }
  const area = `${dPath} L${pts[pts.length - 1][0].toFixed(1)},${PT + ih} L${pts[0][0].toFixed(1)},${PT + ih} Z`;
  const ticks = [0, nice / 2, nice];
  const grid = ticks.map(v => `<line x1="${PL}" y1="${y(v).toFixed(1)}" x2="${W - PR}" y2="${y(v).toFixed(1)}" style="stroke:var(--line)" stroke-width="1"/>
    <text x="${PL - 6}" y="${(y(v) + 3).toFixed(1)}" font-size="8" style="fill:var(--ink-3)" text-anchor="end">${shortT(v)}</text>`).join('');

  return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">
    <defs><linearGradient id="g1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" style="stop-color:var(--accent)" stop-opacity=".26"/>
      <stop offset="100%" style="stop-color:var(--accent)" stop-opacity="0"/>
    </linearGradient></defs>
    ${grid}
    <path d="${area}" fill="url(#g1)"/>
    <path d="${dPath}" fill="none" style="stroke:var(--accent)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/>
    ${pts.length <= 40 ? pts.map((p, i) => `<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="2" style="fill:var(--surface);stroke:var(--accent)" stroke-width="1.4"/>`).join('') : ''}
  </svg>`;
}

function niceMax(v) {
  const e = Math.pow(10, Math.floor(Math.log10(v)));
  const n = v / e;
  const m = n <= 1 ? 1 : n <= 2 ? 2 : n <= 2.5 ? 2.5 : n <= 5 ? 5 : 10;
  return m * e;
}


function heatBlock(h) {
  if (!h || !h.cells.length) return '<div class="empty">暂无数据</div>';
  // cells 已按「周一起、逐日连续」排列，每 7 个一列
  const cols = [];
  for (let i = 0; i < h.cells.length; i += 7) cols.push(h.cells.slice(i, i + 7));
  const html = cols.map(col => `<div class="col">${col.map(c =>
    `<div class="cell" style="background:${c.total ? heatColor(Math.sqrt(c.total / (h.max || 1))) : 'var(--heat0)'}" title="${c.day} · ${shortT(c.total)}"></div>`
  ).join('')}</div>`).join('');
  return `<div class="heat">
    <div class="wd"><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span><span>日</span></div>
    <div class="cols">${html}</div>
  </div>`;
}

function heatColor(ratio) {
  // 5 档离散：小格子上连续插值肉眼分辨不出来，离散反而更好读
  const lv = ratio >= 0.84 ? 5 : ratio >= 0.62 ? 4 : ratio >= 0.38 ? 3 : ratio >= 0.15 ? 2 : 1;
  return 'var(--heat' + lv + ')';
}


function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m]));
}

/** 会话显示名：优先标题，其次「短 ID · N 次请求」 */


/* ---------------- 交互 ---------------- */
function syncMonthNav() {
  const nav = $('#month-nav');
  const m = BUNDLE && BUNDLE.ranges.month;
  const on = RANGE === 'month' && !!m;
  nav.hidden = !on;
  if (!on) return;

  const idx = m.availableMonths.indexOf(MONTH);
  const prev = $('#mn-prev');
  const next = $('#mn-next');
  prev.disabled = idx <= 0;
  next.disabled = idx < 0 || idx >= m.availableMonths.length - 1;

  const isCurrent = MONTH === m.currentMonth;
  const total = activeStats?.totals?.total || 0;
  $('#mn-label').innerHTML = `${ymLabel(MONTH)}${isCurrent ? '<small>本月进行中</small>' : `<small>${shortT(total)} Token</small>`}`;
}

function selectRange(key) {
  RANGE = key;
  if (key === 'month' && BUNDLE?.ranges.month && !MONTH) MONTH = BUNDLE.ranges.month.currentMonth;
  STATS = resolveStats();
  LEGACY_NOTES = new Set(hasLegacy(STATS) ? [RANGE] : []);
  render();
  syncMonthNav();
}

$('#tabs').addEventListener('click', (e) => {
  const b = e.target.closest('button[data-range]');
  if (!b) return;
  [...$('#tabs').children].forEach(x => x.classList.toggle('on', x === b));
  if (BUNDLE) selectRange(b.dataset.range);
  else { RANGE = b.dataset.range; load(false); }
});

function stepMonth(delta) {
  const m = BUNDLE?.ranges?.month;
  if (!m) return;
  const idx = m.availableMonths.indexOf(MONTH);
  const target = m.availableMonths[idx + delta];
  if (!target) return;
  MONTH = target;
  STATS = resolveStats();
  render();
  syncMonthNav();
}
$('#mn-prev').addEventListener('click', () => stepMonth(-1));
$('#mn-next').addEventListener('click', () => stepMonth(1));

$('#btn-refresh').addEventListener('click', () => {
  if (IS_STATIC) { location.reload(); return; }
  BUNDLE = null;
  load(true);
});

// 本地服务模式：回到前台 / 每分钟自动刷新。静态快照不轮询（数据不会自己变）
if (!IS_STATIC) {
  document.addEventListener('visibilitychange', () => { if (!document.hidden) { BUNDLE = null; load(false); } });
  setInterval(() => { if (!document.hidden) { BUNDLE = null; load(false); } }, 60000);
}

load(false).then(() => { syncMonthNav(); });
</script>
